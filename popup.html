<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* ==========================================================
       Conclave — "Council Chamber" design system
       Dark-mode native (default) + light variant. Single indigo
       accent, luminance hierarchy, monospace = machine voice.
       ========================================================== */
    :root {
      --canvas: #08090a;
      --panel: #0f1011;
      --elevated: #191a1b;
      --hover: #28282c;
      --text-1: #f7f8f8;
      --text-2: #d0d6e0;
      --text-3: #8a8f98;
      --text-4: #62666d;
      --accent: #7170ff;
      --accent-surface: #5e6ad2;
      --accent-hover: #828fff;
      --ok: #10b981;
      --err: #f06060;
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.1);
      --shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px rgba(0,0,0,0.4);
    }
    :root[data-theme="light"] {
      --canvas: #f7f8f8;
      --panel: #ffffff;
      --elevated: #f2f3f4;
      --hover: #e9eaec;
      --text-1: #17181a;
      --text-2: #4b5058;
      --text-3: #71767f;
      --text-4: #a3a7ad;
      --accent: #5b5bd6;
      --accent-surface: #5e6ad2;
      --accent-hover: #4f4fc4;
      --ok: #0e9f6e;
      --err: #dc2626;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; }
    body {
      width: 400px; margin: 0; padding: 0;
      background: var(--canvas); color: var(--text-1);
      font: 13px/1.5 Inter, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }

    header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header .brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 13px; letter-spacing: -0.01em; color: var(--text-1);
    }
    header .brand svg { color: var(--accent); }
    .icon-btn {
      border: 1px solid var(--border); background: transparent; color: var(--text-3);
      border-radius: 8px; padding: 5px 7px; cursor: pointer; display: flex; align-items: center;
    }
    .icon-btn:hover { color: var(--text-1); background: var(--hover); }
    .mode-switch {
      margin-left: auto; display: flex; overflow: hidden;
      border: 1px solid var(--border); border-radius: 8px; background: var(--canvas);
    }
    .mode-switch button {
      border: 0; background: transparent; color: var(--text-3);
      padding: 5px 12px; font: 600 12px/1 Inter, system-ui, sans-serif; cursor: pointer;
    }
    .mode-switch button.on { background: var(--accent-surface); color: #fff; }

    .view { padding: 12px 14px 14px; }

    textarea, input[type="text"], input:not([type]) {
      width: 100%; box-sizing: border-box; height: 72px;
      background: var(--panel); color: var(--text-1);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 10px; font: inherit; resize: vertical;
    }
    textarea::placeholder, input::placeholder { color: var(--text-4); }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(113,112,255,0.15); }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
    select {
      background: var(--panel); color: var(--text-1);
      border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font: inherit;
    }
    label { color: var(--text-2); }

    /* ---- simple mode ---- */
    .label { color: var(--text-3); font-weight: 600; margin: 8px 0 6px; font-size: 12px;
             text-transform: uppercase; letter-spacing: 0.06em; }
    .ready-line { display: flex; align-items: center; gap: 7px; color: var(--text-3); margin: 10px 0; font-size: 12px; }
    .ready-line .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); flex: none; }
    .ready-line .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(16,185,129,0.5); }

    .btn-start {
      width: 100%; padding: 12px; border: 0; border-radius: 10px;
      background: var(--accent-surface); color: #fff;
      font: 600 13px/1 Inter, system-ui, sans-serif; letter-spacing: 0.05em;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-start:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-start:disabled { background: var(--hover); color: var(--text-4); cursor: not-allowed; }

    .checklist {
      border: 1px solid var(--border); border-radius: 10px; padding: 8px;
      margin: 10px 0; background: var(--panel);
    }
    .step { display: flex; align-items: center; gap: 10px; padding: 7px 6px; cursor: pointer; border-radius: 8px; }
    .step:hover { background: var(--hover); }
    .step .num {
      width: 22px; height: 22px; border-radius: 7px; display: flex;
      align-items: center; justify-content: center;
      background: var(--elevated); color: var(--text-3);
      font: 600 11px/1 ui-monospace, Menlo, monospace; flex: none;
    }
    .step.done .num { background: rgba(16,185,129,0.12); color: var(--ok); }
    .step .txt { flex: 1; color: var(--text-2); }
    .step .txt small { color: var(--text-4); display: block; font-size: 11px; }
    .step .state { color: var(--text-4); display: flex; align-items: center; gap: 4px; font-size: 11px; }
    .step.done .state { color: var(--ok); }
    .step.done .txt { color: var(--text-1); }
    .step.locked { opacity: 0.5; cursor: default; }

    /* ---- signature element: the machine-log timeline ---- */
    #timeline { margin-top: 12px; max-height: 230px; overflow-y: auto; display: none; }
    .tl-divider {
      display: flex; align-items: center; gap: 10px;
      color: var(--text-4); font: 600 10px/1 ui-monospace, Menlo, monospace;
      text-transform: uppercase; letter-spacing: 0.14em; margin: 12px 0 6px;
    }
    .tl-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .tl-item { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; }
    .tl-item .ic {
      width: 26px; height: 26px; border-radius: 8px;
      background: var(--elevated); color: var(--text-3);
      display: flex; align-items: center; justify-content: center; flex: none;
    }
    .tl-item.attack .ic { color: var(--err); background: rgba(240,96,96,0.1); }
    .tl-item.judge .ic { color: var(--accent); background: rgba(113,112,255,0.1); }
    .tl-item.ok .ic { color: var(--ok); background: rgba(16,185,129,0.1); }
    .tl-item.err .ic { color: var(--err); background: rgba(240,96,96,0.1); }
    .tl-item .tx {
      padding-top: 5px; color: var(--text-2);
      font: 12px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    }
    .tl-item.done .tx { color: var(--text-4); }
    .spin { animation: pulse 1.3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    @keyframes pulse { 50% { opacity: 0.35; } }

    .card { border-radius: 10px; padding: 12px; margin-top: 10px; display: none; border: 1px solid var(--border); }
    .card.result { background: rgba(16,185,129,0.06); border-color: rgba(16,185,129,0.25); }
    .card.error { background: rgba(240,96,96,0.06); border-color: rgba(240,96,96,0.25); }
    .card .head { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text-1); }
    .card.result .head { color: var(--ok); }
    .card.error .head { color: var(--err); }
    .card .preview { margin: 8px 0; color: var(--text-2); max-height: 90px; overflow-y: auto;
                     white-space: pre-wrap; border: 1px solid var(--border); border-radius: 8px;
                     padding: 8px; background: var(--panel);
                     font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    .card .actions { display: flex; gap: 8px; }
    .card button {
      border: 1px solid var(--border); background: var(--panel); color: var(--text-1);
      border-radius: 8px; padding: 6px 12px; font: 600 12px/1 Inter, system-ui, sans-serif;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .card button:hover { background: var(--hover); }
    .card button.primary { background: var(--accent-surface); color: #fff; border-color: transparent; }
    .card button.primary:hover { background: var(--accent-hover); }

    /* ---- advanced mode ---- */
    #advancedView { display: none; }
    h2 { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase;
         letter-spacing: 0.06em; margin: 16px 0 8px; }
    .tabs { margin: 8px 0; max-height: 140px; overflow-y: auto; }
    .tab-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
    .role { color: var(--text-4); }
    .row { display: flex; gap: 10px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
    #advancedView button {
      padding: 6px 14px; border: 1px solid var(--border); background: var(--panel);
      color: var(--text-1); border-radius: 8px; font: 600 12px/1 Inter, system-ui, sans-serif;
      cursor: pointer;
    }
    #advancedView button:hover { background: var(--hover); }
    #status {
      margin-top: 8px; white-space: pre-wrap; max-height: 120px; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; display: none;
      font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--text-3);
    }
    .err { color: var(--err) !important; }

    #manualBox textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    #sessions .tab-row { border-bottom: 1px solid var(--border); }
    #sessions button {
      padding: 3px 7px !important; display: flex; align-items: center;
      color: var(--text-3);
    }
    #sessions button[data-ok="1"]:hover { color: var(--ok); }
    #sessions button[data-ok="0"]:hover { color: var(--err); }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--hover); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <header>
    <span class="brand">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><line x1="5" y1="7" x2="19" y2="7"/><path d="M5 7l-2.5 6a3 3 0 0 0 5 0L5 7z"/><path d="M19 7l-2.5 6a3 3 0 0 0 5 0L19 7z"/></svg>
      Conclave
    </span>
    <button class="icon-btn" id="themeToggle" title="Toggle light / dark"></button>
    <div class="mode-switch">
      <button id="modeSimple" class="on">Simple</button>
      <button id="modeAdvanced">Advanced</button>
    </div>
  </header>

  <!-- ================= SIMPLE ================= -->
  <div class="view" id="simpleView">
    <div class="label">What do you want to build?</div>
    <textarea id="simpleIdea" placeholder="Describe your idea in plain words — the council will debate it and hand you a framework…"></textarea>

    <div class="ready-line" id="simpleReady"></div>
    <div class="checklist" id="checklist"></div>

    <button class="btn-start" id="simpleStart">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      START THE DEBATE
    </button>

    <div id="timeline"></div>
    <div class="card result" id="resultCard"></div>
    <div class="card error" id="errorCard"></div>
  </div>

  <!-- ================= ADVANCED ================= -->
  <div class="view" id="advancedView">
    <h2>Debate setup</h2>
    <textarea id="idea" placeholder="Paste your idea / prompt / Antigravity question here..."></textarea>

    <div class="tabs" id="tabs">Scanning chat tabs...</div>

    <div class="row">
      <label>Rounds:
        <select id="rounds">
          <option>1</option>
          <option>2</option>
          <option selected>3</option>
          <option>4</option>
        </select>
      </label>
      <label><input type="checkbox" id="earlyStop"> Judge may stop early on agreement</label>
    </div>

    <div class="row">
      <label><input type="checkbox" id="adversarial"> Adversary mode (rotates attacker each round)</label>
      <label><input type="checkbox" id="digest" checked> Referee digest (compresses context between rounds)</label>
    </div>

    <div class="row">
      <button id="debate" title="Fully automatic — needs working site selectors">Auto Debate</button>
      <button id="manual" title="You paste and select; immune to UI changes">Manual Debate</button>
      <button id="question" title="Use when Antigravity hit a bug/error">Resolve Question</button>
    </div>

    <div id="manualBox" style="display:none">
      <div id="manualStep" style="margin-top:8px; font-weight:600;"></div>
      <textarea id="manualPrompt" readonly style="height:90px; margin-top:4px;"></textarea>
      <div class="row">
        <button id="copyPrompt">Copy prompt</button>
        <button id="capture">Capture selected answer</button>
      </div>
      <div id="manualHint" class="role"></div>
    </div>

    <div id="status"></div>

    <h2 style="margin-top:12px">Daemon — Project Brain + MCP</h2>
    <div class="row">
      <span id="daemonDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-4)"></span>
      <span id="daemonState" class="mono" style="font-size:11px;color:var(--text-3)">checking…</span>
      <label style="margin-left:auto"><input type="checkbox" id="armDaemon"> Arm daemon mode</label>
    </div>
    <div class="row">
      <input id="projName" placeholder="Project name" style="flex:1;height:30px">
      <input id="projRoot" placeholder="Project folder (for framework.md)" style="flex:1;height:30px">
      <button id="saveProject">Save</button>
    </div>
    <div class="row">
      <label>Routing:
        <select id="daemonRouting">
          <option value="conservative">Conservative</option>
          <option value="balanced" selected>Balanced</option>
          <option value="aggressive">Aggressive</option>
        </select>
      </label>
      <label>Judges:
        <select id="daemonJudges">
          <option value="single">Single</option>
          <option value="synthesis" selected>Synthesis (2 + chief)</option>
          <option value="panel">Panel vote</option>
          <option value="weighted">Weighted panel</option>
        </select>
      </label>
    </div>
    <div id="sessions"></div>
  </div>

  <script src="prompts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
